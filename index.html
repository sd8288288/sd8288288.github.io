<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高端产品展示 - 动态案例页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(120deg, #050505, #1a1a2e); 
            color: #fff; 
            overflow-x: hidden;
        }

        /* 导航栏 - 玻璃拟态 + 滚动透明 */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            z-index: 100;
            transition: all 0.3s ease;
        }
        .logo { font-size: 24px; font-weight: bold; color: #00e4ff; }
        .nav a { color: #fff; margin-left: 30px; text-decoration: none; transition: color 0.3s; }
        .nav a:hover { color: #00e4ff; }

        /* 英雄区 - 大标题 + 视差背景 */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .bg-parallax {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('https://s41.ax1x.com/2026/04/14/perAKAI.jpg') center/cover;     <!-- ************背景图 最好用1080p ************ --> 
            z-index: -1;
            transform: translateZ(-100px);
            will-change: transform;
        }
        .hero h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            margin-bottom: 20px;
            background: linear-gradient(90deg, #00e4ff, #ff0080);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }
        .hero p { font-size: 1.2rem; opacity: 0.8; margin-bottom: 40px; }
        .btn { 
            padding: 15px 40px; 
            background: linear-gradient(90deg, #00e4ff, #0080ff); 
            color: white; 
            border: none; 
            border-radius: 50px; 
            font-size: 16px; 
            cursor: pointer; 
            transition: all 0.3s; 
            box-shadow: 0 0 20px rgba(0, 228, 255, 0.4);
        }
        .btn:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 0 30px rgba(0, 228, 255, 0.8);
        }

        /* 产品展示区 - 3D 卡片 + 滚动动画 */
        .products {
            padding: 100px 5%;
            background: #050505;
        }
        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 60px;
            position: relative;
        }
        .section-title:after {
            content: '';
            width: 80px;
            height: 4px;
            background: #00e4ff;
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }
        .product-card {
            background: #111;
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.5s, box-shadow 0.5s;
            position: relative;
            opacity: 0; /* 初始透明 */
            transform: translateY(50px);
        }
        .product-card.animate {
            opacity: 1;
            transform: translateY(0);
        }
        .product-card:hover {
            transform: translateY(-15px) rotateX(5deg);
            box-shadow: 0 20px 40px rgba(0, 228, 255, 0.3);
        }
        .product-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            transition: transform 0.8s;
        }
        .product-card:hover img { transform: scale(1.1); }
        .card-info { padding: 25px; }
        .card-info h3 { font-size: 1.4rem; margin-bottom: 10px; }
        .card-info .price { 
            color: #00e4ff; 
            font-size: 1.8rem; 
            font-weight: bold; 
            margin: 15px 0;
        }
        .card-info .desc { color: #999; line-height: 1.6; }

        /* 底部霓虹灯效 */
        footer {
            padding: 50px 5%;
            text-align: center;
            background: #000;
            color: #666;
            border-top: 1px solid #333;
        }
        .neon-text {
            color: #00e4ff;
            text-shadow: 0 0 10px #00e4ff, 0 0 20px #00e4ff;
            margin-top: 20px;
        }

        /* 动画定义 */
        @keyframes glow {
            from { filter: brightness(1); }
            to { filter: brightness(1.3); }
        }

        /* 滚动触发动画类 */
        .fade-in { transition: all 0.8s ease; }
    </style>
</head>
<body>
    <!-- 导航 -->
    <header id="navbar">
        <div class="logo">闲的蛋疼 给LOGO占个位置</div>
        <div class="nav">
            <a href="#">首页</a>
            <a href="product-detail.html">产品</a>
            <a href="#">支持</a>
            <a href="#">关于</a>
        </div>
    </header>

    <!-- 英雄区 -->
    <section class="hero">
        <div class="bg-parallax" id="parallax-bg"></div>
        <h1>极致杀伤力 先手为王</h1>
        <p>探索全新一代防身装备的无限可能</p>
        <button class="btn">立即探索</button>
    </section>

    <!-- 产品展示 -->
    <section class="products">
        <h2 class="section-title">核心产品</h2>
        <div class="product-grid">
            <div class="product-card fade-in">
                <img src="https://pica.zhimg.com/80/v2-3cb1e18da05e2fdb844deaa246dd4146_1440w.webp"  alt="知乎图片"  width="800" height="600">     <!-- 左1图 -->
                <div class="card-info">
                    <h3>传承红色大砖头</h3>
                    <p class="desc">暴击+99，便宜实惠，量大管饱</p>
                    <div class="price">¥2.5</div>
                </div>
            </div>
            <div class="product-card fade-in">
                <img src="https://pic2.zhimg.com/80/v2-00b72118ba5ddd28eaf46319ee07398d_1440w.webp"  alt="知乎图片"  width="800" height="600">     <!-- 左2图 -->
                <div class="card-info">
                    <h3>金属球棍（空心）</h3>
                    <p class="desc">回收材料锻造，绝对打不死人，威慑感拉满</p>
                    <div class="price">¥49.9</div>
                </div>
            </div>
            <div class="product-card fade-in">
                <img src="https://pic3.zhimg.com/v2-59534ad8dc9857d8a1231a047c4e1a46_1440w.jpg"  alt="知乎图片"  width="800" height="600">     <!-- 左2图 -->
                <div class="card-info">
                    <h3>臭拖鞋</h3>
                    <p class="desc">极易隐藏，随身携带，伤人于无形</p>
                    <div class="price">¥99.9</div>
                </div>
            </div>
        </div>
    </section>

    <!-- 底部 -->
    <footer>
        <p>© 2026 占个位置 刷一下存在感. All rights reserved.</p>
        <p class="neon-text">猛猛糊弄</p>
    </footer>

    <script>
        // 1. 导航栏滚动效果
        window.addEventListener('scroll', function() {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.style.background = 'rgba(0, 0, 0, 0.8)';
                navbar.style.padding = '15px 5%';
            } else {
                navbar.style.background = 'rgba(0, 0, 0, 0.2)';
                navbar.style.padding = '20px 5%';
            }
        });

        // 2. 视差滚动背景
        window.addEventListener('scroll', function() {
            const bg = document.getElementById('parallax-bg');
            const scrollY = window.scrollY;
            bg.style.transform = `translateY(${scrollY * 0.5}px)`;
        });

        // 3. 滚动触发产品卡片动画
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('animate');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.product-card').forEach(card => {
            observer.observe(card);
        });
    </script>
</body>
</html>
