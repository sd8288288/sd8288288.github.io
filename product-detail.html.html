<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品详情 - GEAR PRO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #050505; 
            color: #fff; 
        }
        header {
            position: fixed; top:0; left:0; right:0;
            padding: 20px 5%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        .logo { font-size: 24px; font-weight: bold; color: #00e4ff; }
        .nav a { color: #fff; margin-left: 30px; text-decoration: none; }
        .nav a:hover { color: #00e4ff; }

        .detail-section {
            padding: 150px 5% 80px;
            display: flex;
            flex-wrap: wrap;
            gap: 50px;
            align-items: center;
            justify-content: center;
        }
        .detail-img {
            flex: 1;
            min-width: 300px;
        }
        .detail-img img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0,228,255,0.2);
        }
        .detail-info {
            flex: 1;
            min-width: 300px;
        }
        .detail-info h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #00e4ff;
        }
        .detail-info .price {
            font-size: 2.2rem;
            font-weight: bold;
            color: #fff;
            margin: 20px 0;
        }
        .detail-info .desc {
            color: #ccc;
            line-height: 1.8;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .btn {
            padding: 15px 40px;
            background: linear-gradient(90deg, #00e4ff, #0080ff);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(0,228,255,0.6);
        }
        footer {
            padding: 50px 5%;
            text-align: center;
            background: #000;
            color: #666;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">GEAR PRO</div>
    <div class="nav">
        <a href="index.html">返回首页</a>
        <a href="#">产品中心</a>
        <a href="#">支持</a>
        <a href="#">关于</a>
    </div>
</header>

<section class="detail-section">
    <div class="detail-img">
        <img src="https://picsum.photos/id/1/800/600" alt="产品图">
    </div>
    <div class="detail-info">
        <h1>极光 Pro 机械键盘</h1>
        <p class="desc">
            Cherry 原厂轴体，RGB 全彩动态背光，CNC 铝合金机身，全键热插拔，支持键线分离，
            内置稳定硅胶垫，声音更纯、手感更脆。专为电竞与办公打造的高端旗舰键盘。
        </p>
        <div class="price">¥ 899.00</div>
        <button class="btn">立即购买</button>
    </div>
</section>

<footer>
    © 2026 GEAR PRO. All rights reserved.
</footer>

</body>
</html>
