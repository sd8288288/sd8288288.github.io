<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuck Generator — Apple Design</title>
    <style>
        /* ===== Reset & Base — Apple风格 ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 浅色模式（默认） */
            --bg: #f5f5f7;
            --card-bg: rgba(255,255,255,0.82);
            --card-border: rgba(255,255,255,0.45);
            --card-shadow: rgba(0,0,0,0.08);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --accent-active: #006edb;
            --glass-bg: rgba(255,255,255,0.55);
            --glass-border: rgba(255,255,255,0.35);
            --separator: rgba(0,0,0,0.06);
            --toggle-bg: #e8e8ed;
            --toggle-thumb: #ffffff;
        }

        /* 暗色模式 — 通过 .dark 类覆盖 */
        body.dark {
            --bg: #000000;
            --card-bg: rgba(28,28,30,0.85);
            --card-border: rgba(255,255,255,0.08);
            --card-shadow: rgba(0,0,0,0.4);
            --text-primary: #f5f5f7;
            --text-secondary: #98989d;
            --accent: #2997ff;
            --accent-hover: #40a9ff;
            --accent-active: #2481d0;
            --glass-bg: rgba(28,28,30,0.50);
            --glass-border: rgba(255,255,255,0.06);
            --separator: rgba(255,255,255,0.08);
            --toggle-bg: #39393d;
            --toggle-thumb: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background 0.4s cubic-bezier(0.25,0.1,0.25,1);
            overflow-x: hidden;
        }

        /* ===== 动态渐变背景 ===== */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(600px circle at 20% 30%, rgba(0,113,227,0.06) 0%, transparent 70%),
                radial-gradient(500px circle at 80% 20%, rgba(0,113,227,0.04) 0%, transparent 70%),
                radial-gradient(400px circle at 50% 80%, rgba(0,113,227,0.03) 0%, transparent 70%);
            pointer-events: none;
            transition: opacity 0.6s ease;
        }

        body.dark::before {
            background:
                radial-gradient(600px circle at 20% 30%, rgba(41,151,255,0.08) 0%, transparent 70%),
                radial-gradient(500px circle at 80% 20%, rgba(41,151,255,0.05) 0%, transparent 70%),
                radial-gradient(400px circle at 50% 80%, rgba(41,151,255,0.04) 0%, transparent 70%);
        }

        /* ===== 主容器 ===== */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        /* ===== 顶部栏（logo + 切换开关） ===== */
        .top-bar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            animation: headerFadeIn 0.8s cubic-bezier(0.25,0.1,0.25,1) both;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* ===== 图标样式（修正偏右 + 放大） ===== */
        .logo-container {
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(calc(-50% - 10px));
            z-index: 2;
            animation: headerFadeIn 0.8s cubic-bezier(0.25,0.1,0.25,1) both;
        }

        .logo-icon {
            width: 100px;
            height: 100px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: filter 0.3s ease;
        }

        body.dark .logo-icon {
            filter: invert(1) brightness(0.9);
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: transform 0.3s cubic-bezier(0.25,0.1,0.25,1);
        }

        .logo-icon img:hover {
            transform: scale(1.08) rotate(-6deg);
        }

        /* ===== Apple 风格滑块开关 (Toggle) ===== */
        .theme-toggle {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .theme-toggle input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            pointer-events: none;
        }

        .toggle-track {
            position: relative;
            width: 48px;
            height: 30px;
            background: var(--toggle-bg);
            border-radius: 15px;
            transition: background 0.3s cubic-bezier(0.25,0.1,0.25,1);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.08);
            flex-shrink: 0;
        }

        .toggle-track::before {
            content: '☀️';
            position: absolute;
            left: 5px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            line-height: 1;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .toggle-track::after {
            content: '🌙';
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            line-height: 1;
            opacity: 1;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--toggle-thumb);
            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15), 0 0 0 0.5px rgba(0,0,0,0.04);
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), background 0.3s ease;
            z-index: 2;
        }

        .theme-toggle input:checked + .toggle-track {
            background: var(--accent);
        }

        .theme-toggle input:checked + .toggle-track::before {
            opacity: 1;
        }

        .theme-toggle input:checked + .toggle-track::after {
            opacity: 0;
        }

        .theme-toggle input:checked + .toggle-track .toggle-thumb {
            transform: translateX(18px);
        }

        .theme-toggle input:focus-visible + .toggle-track {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .toggle-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.2px;
            transition: color 0.3s ease;
            white-space: nowrap;
        }

        /* ===== 头部文字 ===== */
        .header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: headerFadeIn 0.8s cubic-bezier(0.25,0.1,0.25,1) both;
            margin-top: 40px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.2px;
            max-width: 360px;
            line-height: 1.5;
        }

        /* ===== 玻璃卡片 ===== */
        .card {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(32px) saturate(1.2);
            -webkit-backdrop-filter: blur(32px) saturate(1.2);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow:
                0 0 0 1px var(--card-border),
                0 8px 32px var(--card-shadow),
                0 2px 4px rgba(0,0,0,0.02);
            transition: transform 0.3s ease, box-shadow 0.4s ease, background 0.4s ease, border-color 0.4s ease;
            animation: cardSlideUp 0.7s cubic-bezier(0.25,0.1,0.25,1) 0.15s both;
        }

        .card:hover {
            box-shadow:
                0 0 0 1px var(--card-border),
                0 12px 48px var(--card-shadow),
                0 4px 8px rgba(0,0,0,0.03);
        }

        /* 句子内容区 */
        .sentence-area {
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .sentence-area::before {
            content: '\201C';
            position: absolute;
            top: -16px;
            left: -8px;
            font-size: 64px;
            line-height: 1;
            color: var(--accent);
            opacity: 0.15;
            font-family: "Georgia", serif;
            pointer-events: none;
            transition: color 0.4s ease;
        }

        .sentence-area::after {
            content: '\201D';
            position: absolute;
            bottom: -32px;
            right: -8px;
            font-size: 64px;
            line-height: 1;
            color: var(--accent);
            opacity: 0.15;
            font-family: "Georgia", serif;
            pointer-events: none;
            transition: color 0.4s ease;
        }

        .sentence {
            font-size: 22px;
            font-weight: 500;
            line-height: 1.65;
            text-align: center;
            color: var(--text-primary);
            letter-spacing: 0.2px;
            transition: opacity 0.25s ease, color 0.4s ease;
            max-width: 100%;
            word-break: break-word;
        }

        .sentence.fade {
            opacity: 0;
            transform: translateY(8px);
        }

        /* 分隔线 */
        .divider {
            width: 100%;
            height: 1px;
            background: var(--separator);
            margin: 4px 0;
            transition: background 0.4s ease;
        }

        /* 计数 */
        .meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.3px;
            transition: color 0.4s ease;
        }

        .count-badge {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 4px 14px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
        }

        /* ===== 按钮基础样式（桌面端） ===== */
        .btn-group {
            display: flex;
            gap: 12px;
            width: 100%;
            animation: cardSlideUp 0.7s cubic-bezier(0.25,0.1,0.25,1) 0.3s both;
        }

        .btn {
            flex: 1;
            height: 52px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s cubic-bezier(0.25,0.1,0.25,1);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            position: relative;
            overflow: hidden;
            /* 基础兜底：保证最小触控尺寸 */
            min-height: 44px;
            min-width: 44px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 8px rgba(0,113,227,0.3);
            transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 16px rgba(0,113,227,0.35);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            background: var(--accent-active);
            box-shadow: 0 1px 4px rgba(0,113,227,0.25);
            transform: translateY(0);
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent);
            border: 1.5px solid var(--accent);
            box-shadow: none;
            flex: 1;
            transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease, transform 0.15s ease;
        }

        .btn-secondary:hover {
            background: rgba(0,113,227,0.06);
            transform: translateY(-1px);
        }

        .btn-secondary:active {
            background: rgba(0,113,227,0.1);
            transform: translateY(0);
        }

        /* 按钮波纹 */
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--ripple-x, 50%) var(--ripple-y, 50%), rgba(255,255,255,0.2) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .btn:active::after {
            opacity: 1;
        }

        /* ===== Footer ===== */
        .footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
            opacity: 0.6;
            animation: cardSlideUp 0.7s cubic-bezier(0.25,0.1,0.25,1) 0.45s both;
            transition: color 0.4s ease;
        }

        /* ===== 动画 ===== */
        @keyframes headerFadeIn {
            from { opacity: 0; transform: translateY(-12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes cardSlideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(24px); }
        }

        @keyframes contentIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .content-enter {
            animation: contentIn 0.35s cubic-bezier(0.25,0.1,0.25,1) both;
        }

        /* ===== 键盘快捷键提示 ===== */
        .key-hint {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: var(--text-secondary);
            opacity: 0.5;
            margin-top: 4px;
            letter-spacing: 0.5px;
            transition: color 0.4s ease;
        }

        kbd {
            display: inline-block;
            padding: 1px 6px;
            font-size: 10px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--glass-bg);
            border: 0.5px solid var(--glass-border);
            border-radius: 4px;
            min-width: 18px;
            text-align: center;
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        /* ===== 震感动画 ===== */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10% { transform: translateX(-2px); }
            30% { transform: translateX(2px); }
            50% { transform: translateX(-2px); }
            70% { transform: translateX(2px); }
            90% { transform: translateX(-1px); }
        }

        .shake {
            animation: shake 0.4s ease;
        }

        /* ===================== 移动端核心修复（手机按钮扁/窄专用） ===================== */
        @media (max-width: 520px) {
            body { padding: 16px; }
            .card { padding: 28px 20px; border-radius: 16px; }
            .sentence { font-size: 19px; }
            .header h1 { font-size: 28px; }

            /* 按钮组：垂直排列，增加上下间距 */
            .btn-group {
                flex-direction: column;
                gap: 14px; /* 加大按钮之间间距，避免拥挤 */
            }

            /* 【重点修复】手机按钮：加高高度 + 加大上下内边距，彻底解决扁、窄 */
            .btn {
                height: 56px; /* 提高高度，视觉不扁 */
                padding: 14px 20px; /* 上下内边距撑开高度，左右撑开宽度 */
                font-size: 16px; /* 字号保持舒适 */
                border-radius: 12px;
                /* 强制最小尺寸，符合移动端触控标准 44*44px */
                min-height: 52px;
                min-width: 100%; /* 手机端按钮铺满整行，解决“窄”问题 */
            }

            /* 移动端图标适配 */
            .logo-icon { width: 80px; height: 80px; }
            .logo-container {
                top: -60px;
                transform: translateX(calc(-50% - 8px));
            }

            .toggle-label { display: none; }
            .top-bar { padding: 0 2px; }
            .header { margin-top: 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 独立的Logo容器（靠上中间+修正偏右+放大） -->
        <div class="logo-container">
            <div class="logo-icon" aria-label="图标" role="img">
                <img src="https://bee-reg-ab.imagency.cn/e/b47e37c6ae72098bcc3e7d742c8daed1.png" alt="图标" />
            </div>
        </div>

        <!-- Top Bar: 仅保留主题切换 -->
        <div class="top-bar">
            <label class="theme-toggle" id="themeToggle">
                <span class="toggle-label" id="toggleLabel">深色模式</span>
                <input type="checkbox" id="themeCheckbox" aria-label="切换深色/浅色模式">
                <div class="toggle-track">
                    <div class="toggle-thumb"></div>
                </div>
            </label>
        </div>

        <!-- Header -->
        <header class="header">
            <h1>Fuck Generator</h1>
            <p>一键生成令人破防的祖安语录，精准打击玻璃心</p>
        </header>

        <!-- Card -->
        <div class="card" id="card">
            <div class="sentence-area">
                <p class="sentence" id="result">加载中…</p>
            </div>
            <div class="divider"></div>
            <div class="meta">
                <span>火力全开 · 持续输出</span>
                <span class="count-badge" id="countBadge">共 1069 条</span>
            </div>
        </div>

        <!-- Buttons -->
        <div class="btn-group">
            <button class="btn btn-primary" id="nextBtn">
                <span>→</span> 再来一条
            </button>
            <button class="btn btn-secondary" id="copyBtn" title="复制到剪贴板">
                📋 复制
            </button>
        </div>

        <!-- Key hint -->
        <div class="key-hint">
            按 <kbd>Space</kbd> 或 <kbd>Enter</kbd> 刷新
        </div>

        <!-- Footer -->
        <footer class="footer">
            Designed with 🍎 Apple Style
        </footer>
    </div>

    <script>
        // ===== 主题切换 =====
        const checkbox = document.getElementById('themeCheckbox');
        const toggleLabel = document.getElementById('toggleLabel');
        const STORAGE_KEY = 'fuck-gen-theme';

        function initTheme() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved === 'dark') {
                document.body.classList.add('dark');
                checkbox.checked = true;
                toggleLabel.textContent = '浅色模式';
            } else if (saved === 'light') {
                document.body.classList.remove('dark');
                checkbox.checked = false;
                toggleLabel.textContent = '深色模式';
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (prefersDark) {
                    document.body.classList.add('dark');
                    checkbox.checked = true;
                    toggleLabel.textContent = '浅色模式';
                } else {
                    document.body.classList.remove('dark');
                    checkbox.checked = false;
                    toggleLabel.textContent = '深色模式';
                }
            }
            refreshAccentColors();
        }

        function toggleTheme(e) {
            const isDark = e.target.checked;
            if (isDark) {
                document.body.classList.add('dark');
                toggleLabel.textContent = '浅色模式';
                localStorage.setItem(STORAGE_KEY, 'dark');
            } else {
                document.body.classList.remove('dark');
                toggleLabel.textContent = '深色模式';
                localStorage.setItem(STORAGE_KEY, 'light');
            }
            refreshAccentColors();
        }

        function refreshAccentColors() {
            const svg = document.querySelector('.logo-icon svg');
            if (svg) {
                svg.style.display = 'none';
                void svg.offsetHeight;
                svg.style.display = '';
            }
        }

        checkbox.addEventListener('change', toggleTheme);

        // ===== 原始语库 =====
        const sentences = [
            "就你这理解能力，小学老师看了都得连夜辞职",
            "你是不是没睡醒？脑子还在梦里没带出来吧？",
            "建议你先回炉重造一下语言系统再出来对线",
            "你说的每一句话都在刷新我对人类下限的认知",
            "你的逻辑链断得比我家电线还彻底"
        ];

        const $ = id => document.getElementById(id);
        const result = $('result');
        const countBadge = $('countBadge');
        const card = $('card');

        let currentIndex = -1;
        let isAnimating = false;

        countBadge.textContent = `共 ${sentences.length} 条`;

        function getRandomIndex() {
            if (sentences.length === 0) return -1;
            if (sentences.length === 1) return 0;
            let idx;
            do {
                idx = Math.floor(Math.random() * sentences.length);
            } while (idx === currentIndex);
            return idx;
        }

        function getRandomSentence() {
            if (isAnimating) return;
            if (sentences.length === 0) {
                result.textContent = '⚠️ 语库已空，请补充内容';
                return;
            }

            isAnimating = true;
            result.classList.add('fade');

            setTimeout(() => {
                const idx = getRandomIndex();
                if (idx === -1) {
                    result.textContent = '⚠️ 语库异常';
                    isAnimating = false;
                    return;
                }
                currentIndex = idx;
                result.textContent = sentences[idx];
                result.classList.remove('fade');
                result.classList.remove('content-enter');
                void result.offsetWidth;
                result.classList.add('content-enter');

                card.classList.remove('shake');
                void card.offsetWidth;
                card.classList.add('shake');

                setTimeout(() => {
                    isAnimating = false;
                }, 400);
            }, 200);
        }

        function copySentence() {
            const text = result.textContent;
            if (!text || text === '加载中…' || text.startsWith('⚠️')) return;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text)
                    .then(() => {
                        const btn = $('copyBtn');
                        const orig = btn.innerHTML;
                        btn.innerHTML = '✅ 已复制';
                        btn.style.borderColor = '#30d158';
                        btn.style.color = '#30d158';
                        setTimeout(() => {
                            btn.innerHTML = orig;
                            btn.style.borderColor = '';
                            btn.style.color = '';
                        }, 1500);
                    })
                    .catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                const btn = $('copyBtn');
                const orig = btn.innerHTML;
                btn.innerHTML = '✅ 已复制';
                setTimeout(() => { btn.innerHTML = orig; }, 1500);
            } catch (e) {
                alert('复制失败，请手动复制');
            }
            document.body.removeChild(ta);
        }

        // ===== 事件绑定 =====
        $('nextBtn').addEventListener('click', getRandomSentence);
        $('copyBtn').addEventListener('click', copySentence);

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                getRandomSentence();
            }
        });

        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('pointerdown', (e) => {
                const rect = btn.getBoundingClientRect();
                btn.style.setProperty('--ripple-x', ((e.clientX - rect.left) / rect.width * 100) + '%');
                btn.style.setProperty('--ripple-y', ((e.clientY - rect.top) / rect.height * 100) + '%');
            });
        });

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            setTimeout(getRandomSentence, 400);
        });
    </script>
</body>
</html>
